name: KernelSU-Next Builder

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild even if version already exists'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build_ksun:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if KernelSU-Next Version Changed
        id: check
        run: |
          KSUN_JSON=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/latest)
          KSUN_TAG=$(echo "$KSUN_JSON" | jq -r '.tag_name // empty')
          IS_PRERELEASE=$(echo "$KSUN_JSON" | jq -r '.prerelease // false')
          CORE_VER=$(echo "$KSUN_TAG" | grep -oE '^v?[0-9]+\.[0-9]+\.[0-9]+' || true)

          if [ -z "$CORE_VER" ] || [ "$IS_PRERELEASE" = "true" ]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          LAST_VER=""
          [ -f .ksun_version ] && LAST_VER=$(cat .ksun_version | tr -d '[:space:]')
          RELEASE_TAG="ksun-${CORE_VER}"

          if [ "${{ github.event.inputs.force_build }}" != "true" ] && [ "$CORE_VER" = "$LAST_VER" ]; then
            echo "KernelSU-Next $CORE_VER already built. Skipping!"
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "KSUN_TAG=$KSUN_TAG" >> $GITHUB_ENV
          echo "CORE_VER=$CORE_VER" >> $GITHUB_ENV
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "should_build=true" >> $GITHUB_OUTPUT

      - name: Fetch KernelSU-Next LKM, SuSFS Module & magiskboot
        if: steps.check.outputs.should_build == 'true'
        run: |
          KSUN_JSON=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/latest)
          KSUD_URL=$(echo "$KSUN_JSON" | jq -r '.assets[] | select(.name == "ksud-aarch64-linux-android") | .browser_download_url')
          curl -fL "$KSUD_URL" -o ksud && chmod +x ksud

          APK_URL=$(echo "$KSUN_JSON" | jq -r '.assets[] | select((.name | ascii_downcase | contains("spoof")) and (.name | endswith(".apk"))) | .browser_download_url' | head -n 1)
          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            APK_URL=$(echo "$KSUN_JSON" | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          fi
          curl -fL "$APK_URL" -o manager.apk

          for KMI in android14-6.1 android15-6.6 android16-6.12 android17-6.18; do
            KO_URL=$(echo "$KSUN_JSON" | jq -r ".assets[] | select(.name | contains(\"${KMI}\") and endswith(\".ko\")) | .browser_download_url" | head -n 1)
            [ "$KO_URL" != "null" ] && [ -n "$KO_URL" ] && curl -fL "$KO_URL" -o "${KMI}_kernelsu.ko"
          done

          SUSFS_URL=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/sidex15/susfs4ksu-module/releases/latest | jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' | head -n 1)
          [ -n "$SUSFS_URL" ] && [ "$SUSFS_URL" != "null" ] && curl -fL "$SUSFS_URL" -o susfs4ksu.zip || true

          MAGISK_URL=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/topjohnwu/Magisk/releases/latest | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          curl -fL "$MAGISK_URL" -o magisk.apk
          unzip -p magisk.apk lib/arm64-v8a/libmagiskboot.so > magiskboot
          chmod +x magiskboot && rm -f magisk.apk

      - name: Package KernelSU-Next ZIP
        if: steps.check.outputs.should_build == 'true'
        run: |
          ZIP_NAME="KernelSU_Next_${{ env.CORE_VER }}_SuSFS_Universal_Installer.zip"
          zip -r9 "$ZIP_NAME" META-INF ksud magiskboot manager.apk *.ko susfs4ksu.zip 2>/dev/null || zip -r9 "$ZIP_NAME" META-INF ksud magiskboot manager.apk *.ko
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Save New KSUN Version State
        if: steps.check.outputs.should_build == 'true'
        run: |
          echo "${{ env.CORE_VER }}" > .ksun_version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .ksun_version
          git diff --staged --quiet || (git commit -m "chore(release): record KernelSU-Next ${{ env.CORE_VER }}" && git push origin main)

      - name: Publish GitHub Release
        if: steps.check.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.RELEASE_TAG }}"
          name: "⚡ KernelSU-Next ${{ env.CORE_VER }} + SuSFS Universal Installer"
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true

      - name: Upload to Telegram Channel (@Evil_twin_peridot)
        if: steps.check.outputs.should_build == 'true'
        run: |
          CAPTION="⚡ <b>AEGIS-ROOT : KernelSU-Next + SuSFS Universal Installer</b>
          👤 <b>Maintainer:</b> @Raju_D_yeager

          🔹 <b>KernelSU-Next:</b> <code>${{ env.CORE_VER }}</code>
          🔹 <b>Bundled Addons:</b> <code>SuSFS4KSU Module + Spoofed APK (in /Download)</code>
          🔹 <b>Universal KMIs:</b> <code>A14-6.1 | A15-6.6 | A16-6.12 | A17-6.18</code>

          📦 <i>Patches init_boot/boot, syncs ksud + Zygisk Next dir, and stages SuSFS4KSU module</i>"

          RESP=$(curl -s \
            --form-string "chat_id=${TG_CHAT_ID}" \
            -F "document=@${{ env.ZIP_NAME }}" \
            --form-string "parse_mode=HTML" \
            --form-string "caption=${CAPTION}" \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument")

          if [ "$(echo "$RESP" | jq -r .ok)" != "true" ]; then
            curl -s \
              --form-string "chat_id=-1004367113991" \
              -F "document=@${{ env.ZIP_NAME }}" \
              --form-string "parse_mode=HTML" \
              --form-string "caption=${CAPTION}" \
              "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument"
          fi
