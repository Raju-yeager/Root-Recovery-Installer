name: KernelSU-Next Builder

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild even if version already exists'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build_ksun:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check KernelSU-Next Stable Version
        id: check
        run: |
          KSUN_JSON=$(gh api repos/KernelSU-Next/KernelSU-Next/releases/latest)
          KSUN_TAG=$(echo "$KSUN_JSON" | jq -r '.tag_name // empty')
          IS_PRERELEASE=$(echo "$KSUN_JSON" | jq -r '.prerelease // false')
          CORE_VER=$(echo "$KSUN_TAG" | grep -oE '^v?[0-9]+\.[0-9]+\.[0-9]+' || true)

          if [ -z "$CORE_VER" ] || [ "$IS_PRERELEASE" = "true" ]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          LAST_VER=""
          [ -f .ksun_version ] && LAST_VER=$(cat .ksun_version | tr -d '[:space:]')
          RELEASE_TAG="ksun-${CORE_VER}"

          if [ "${{ github.event.inputs.force_build }}" != "true" ] && [ "$CORE_VER" = "$LAST_VER" ]; then
            echo "KernelSU-Next $CORE_VER already built. Skipping!"
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "KSUN_TAG=$KSUN_TAG" >> $GITHUB_ENV
          echo "CORE_VER=$CORE_VER" >> $GITHUB_ENV
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "should_build=true" >> $GITHUB_OUTPUT

      - name: Fetch KernelSU-Next android14-6.1 LKM & ksud
        if: steps.check.outputs.should_build == 'true'
        run: |
          retry_dl() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "Attempt $i failed, retrying in 4s..."
              sleep 4
            done
            return 1
          }

          retry_dl gh release download "${{ env.KSUN_TAG }}" -R KernelSU-Next/KernelSU-Next -p "ksud-aarch64-linux-android" -O ksud --clobber
          chmod +x ksud

          retry_dl gh release download "${{ env.KSUN_TAG }}" -R KernelSU-Next/KernelSU-Next -p "*android14-6.1*.ko" --clobber
          FOUND_KO=$(ls *android14-6.1*.ko | head -n 1)
          [ "$FOUND_KO" != "android14-6.1_kernelsu.ko" ] && mv -f "$FOUND_KO" android14-6.1_kernelsu.ko || true

      - name: Package KernelSU-Next A14-6.1 ZIP
        if: steps.check.outputs.should_build == 'true'
        run: |
          ZIP_NAME="KernelSU_Next_${{ env.CORE_VER }}_A14-6.1_Installer.zip"
          zip -r9 "$ZIP_NAME" META-INF ksud android14-6.1_kernelsu.ko
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Save KSUN Version State
        if: steps.check.outputs.should_build == 'true'
        run: |
          echo "${{ env.CORE_VER }}" > .ksun_version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .ksun_version
          git diff --staged --quiet || (git commit -m "chore(release): KernelSU-Next ${{ env.CORE_VER }}" && git push origin main)

      - name: Publish GitHub Release
        if: steps.check.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.RELEASE_TAG }}"
          name: "⚡ KernelSU-Next ${{ env.CORE_VER }} (Android 14 - 6.1) Installer"
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true

      - name: Upload to Telegram Channel (@Evil_twin_peridot)
        if: steps.check.outputs.should_build == 'true'
        run: |
          CAPTION="⚡ <b>AEGIS-ROOT : KernelSU-Next Installer</b>
          👤 <b>Maintainer:</b> @Raju_D_yeager

          🔹 <b>Version:</b> <code>${{ env.CORE_VER }}</code>
          🔹 <b>Target KMI:</b> <code>android14-6.1</code>

          📦 <i>Pure ramdisk root installer for Linux 6.1 devices</i>"

          RESP=$(curl -s --retry 3 \
            --form-string "chat_id=${TG_CHAT_ID}" \
            -F "document=@${{ env.ZIP_NAME }}" \
            --form-string "parse_mode=HTML" \
            --form-string "caption=${CAPTION}" \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument")

          if [ "$(echo "$RESP" | jq -r .ok)" != "true" ]; then
            curl -s --retry 3 \
              --form-string "chat_id=-1004367113991" \
              -F "document=@${{ env.ZIP_NAME }}" \
              --form-string "parse_mode=HTML" \
              --form-string "caption=${CAPTION}" \
              "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument"
          fi
