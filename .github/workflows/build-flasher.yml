name: SukiSU-Ultra Builder

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild even if version already exists'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build_sukisu:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if SukiSU-Ultra Version Changed
        id: check
        run: |
          SUKI_JSON=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/releases/latest)
          SUKI_TAG=$(echo "$SUKI_JSON" | jq -r '.tag_name // empty')
          IS_PRERELEASE=$(echo "$SUKI_JSON" | jq -r '.prerelease // false')
          CORE_VER=$(echo "$SUKI_TAG" | grep -oE '^v?[0-9]+\.[0-9]+\.[0-9]+' || true)

          if [ -z "$CORE_VER" ] || [ "$IS_PRERELEASE" = "true" ]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          LAST_VER=""
          [ -f .suki_version ] && LAST_VER=$(cat .suki_version | tr -d '[:space:]')
          RELEASE_TAG="sukisu-${CORE_VER}"

          if [ "${{ github.event.inputs.force_build }}" != "true" ] && [ "$CORE_VER" = "$LAST_VER" ]; then
            echo "SukiSU-Ultra $CORE_VER already built. Skipping!"
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "SUKI_TAG=$SUKI_TAG" >> $GITHUB_ENV
          echo "CORE_VER=$CORE_VER" >> $GITHUB_ENV
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "should_build=true" >> $GITHUB_OUTPUT

      - name: Fetch SukiSU-Ultra LKM & ksud Only (~3.5MB)
        if: steps.check.outputs.should_build == 'true'
        run: |
          SUKI_JSON=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/releases/latest)
          KSUD_URL=$(echo "$SUKI_JSON" | jq -r '.assets[] | select(.name == "ksud-aarch64-linux-android") | .browser_download_url')
          curl -fL "$KSUD_URL" -o ksud && chmod +x ksud

          for KMI in android14-6.1 android15-6.6 android16-6.12 android17-6.18; do
            KO_URL=$(echo "$SUKI_JSON" | jq -r ".assets[] | select(.name | endswith(\"${KMI}_kernelsu.ko\")) | .browser_download_url" | head -n 1)
            [ "$KO_URL" != "null" ] && [ -n "$KO_URL" ] && curl -fL "$KO_URL" -o "${KMI}_kernelsu.ko"
          done

      - name: Package Lean SukiSU-Ultra ZIP (~3.5MB)
        if: steps.check.outputs.should_build == 'true'
        run: |
          ZIP_NAME="SukiSU_Ultra_${{ env.CORE_VER }}_A14+_Installer.zip"
          zip -r9 "$ZIP_NAME" META-INF ksud *.ko
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Save New SukiSU Version State
        if: steps.check.outputs.should_build == 'true'
        run: |
          echo "${{ env.CORE_VER }}" > .suki_version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .suki_version
          git diff --staged --quiet || (git commit -m "chore(release): record SukiSU-Ultra ${{ env.CORE_VER }}" && git push origin main)

      - name: Publish GitHub Release
        if: steps.check.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.RELEASE_TAG }}"
          name: "⚡ SukiSU-Ultra ${{ env.CORE_VER }} A14+ Installer"
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true

      - name: Upload to Telegram Channel (@Evil_twin_peridot)
        if: steps.check.outputs.should_build == 'true'
        run: |
          CAPTION="⚡ <b>AEGIS-ROOT : SukiSU-Ultra A14+ Installer</b>
          👤 <b>Maintainer:</b> @Raju_D_yeager

          🔹 <b>SukiSU-Ultra:</b> <code>${{ env.CORE_VER }}</code>
          🔹 <b>Universal KMIs:</b> <code>A14-6.1 | A15-6.6 | A16-6.12 | A17-6.18</code>

          📦 <i>Ultra-lean (~3.5MB) pure ramdisk patcher — zero /data modifications</i>"

          RESP=$(curl -s \
            --form-string "chat_id=${TG_CHAT_ID}" \
            -F "document=@${{ env.ZIP_NAME }}" \
            --form-string "parse_mode=HTML" \
            --form-string "caption=${CAPTION}" \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument")

          if [ "$(echo "$RESP" | jq -r .ok)" != "true" ]; then
            curl -s \
              --form-string "chat_id=-1004367113991" \
              -F "document=@${{ env.ZIP_NAME }}" \
              --form-string "parse_mode=HTML" \
              --form-string "caption=${CAPTION}" \
              "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument"
          fi
