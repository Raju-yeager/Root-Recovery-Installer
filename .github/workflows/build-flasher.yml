name: SukiSU-Ultra Builder

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild even if version already exists'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build_sukisu:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check SukiSU-Ultra Stable Version
        id: check
        run: |
          SUKI_JSON=$(gh api repos/SukiSU-Ultra/SukiSU-Ultra/releases/latest)
          SUKI_TAG=$(echo "$SUKI_JSON" | jq -r '.tag_name // empty')
          IS_PRERELEASE=$(echo "$SUKI_JSON" | jq -r '.prerelease // false')
          CORE_VER=$(echo "$SUKI_TAG" | grep -oE '^v?[0-9]+\.[0-9]+\.[0-9]+' || true)

          if [ -z "$CORE_VER" ] || [ "$IS_PRERELEASE" = "true" ]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          APK_URL=$(echo "$SUKI_JSON" | jq -r '.assets[] | select((.name | ascii_downcase | contains("spoof")) and (.name | endswith(".apk"))) | .browser_download_url' | head -n 1)
          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            APK_URL=$(echo "$SUKI_JSON" | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          fi

          LAST_VER=""
          [ -f .suki_version ] && LAST_VER=$(cat .suki_version | tr -d '[:space:]')
          RELEASE_TAG="sukisu-${CORE_VER}"

          if [ "${{ github.event.inputs.force_build }}" != "true" ] && [ "$CORE_VER" = "$LAST_VER" ]; then
            echo "SukiSU-Ultra $CORE_VER already built. Skipping!"
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "SUKI_TAG=$SUKI_TAG" >> $GITHUB_ENV
          echo "CORE_VER=$CORE_VER" >> $GITHUB_ENV
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "APK_URL=$APK_URL" >> $GITHUB_ENV
          echo "should_build=true" >> $GITHUB_OUTPUT

      - name: Fetch SukiSU-Ultra android14-6.1 LKM & ksud
        if: steps.check.outputs.should_build == 'true'
        run: |
          retry_dl() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              sleep 4
            done
            return 1
          }

          retry_dl gh release download "${{ env.SUKI_TAG }}" -R SukiSU-Ultra/SukiSU-Ultra -p "ksud-aarch64-linux-android" -O ksud --clobber
          chmod +x ksud

          retry_dl gh release download "${{ env.SUKI_TAG }}" -R SukiSU-Ultra/SukiSU-Ultra -p "*android14-6.1_kernelsu.ko" --clobber
          FOUND_KO=$(ls *android14-6.1_kernelsu.ko | head -n 1)
          [ "$FOUND_KO" != "android14-6.1_kernelsu.ko" ] && mv -f "$FOUND_KO" android14-6.1_kernelsu.ko || true

      - name: Package SukiSU-Ultra A14-6.1 ZIP
        if: steps.check.outputs.should_build == 'true'
        run: |
          ZIP_NAME="SukiSU_Ultra_${{ env.CORE_VER }}_A14-6.1_Installer.zip"
          zip -r9 "$ZIP_NAME" META-INF ksud android14-6.1_kernelsu.ko
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Save SukiSU Version State
        if: steps.check.outputs.should_build == 'true'
        run: |
          echo "${{ env.CORE_VER }}" > .suki_version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .suki_version
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): SukiSU-Ultra ${{ env.CORE_VER }}"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin main && break
              sleep 3
            done
          fi

      - name: Publish GitHub Release
        if: steps.check.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.RELEASE_TAG }}"
          name: "⚡ SukiSU-Ultra ${{ env.CORE_VER }} (Android 14 - 6.1) Recovery Installer"
          files: ${{ env.ZIP_NAME }}
          body: |
            ### ⚡ SukiSU-Ultra ${{ env.CORE_VER }} Recovery Root Installer
            - **Maintainer:** [@Raju_D_yeager](https://t.me/Evil_twin_peridot)
            - **Credit:** `@Khargosxh18`
            - **Target KMI:** `android14-6.1` (Linux 6.1)
            - **Working ROMs:** All AOSP Custom ROMs, HyperOS, MIUI & OEM Ports (Kernel 6.1)
            - **Supported APK:** Works on **Spoofed Manager Build** ([Download Matching Spoofed APK](${{ env.APK_URL }})) & Standard Manager
            - **Flash Guide:** `Reboot to Recovery ➔ Flash Installer ZIP ➔ Reboot to System & Install Spoofed Manager APK`

      - name: Upload to Telegram Channel (@Evil_twin_peridot)
        if: steps.check.outputs.should_build == 'true'
        run: |
          CAPTION="⚡ <b>AEGIS-ROOT : SukiSU-Ultra Recovery Installer</b>
          👤 <b>Maintainer:</b> @Raju_D_yeager
          🎖 <b>Credit:</b> @Khargosxh18

          🔹 <b>Version:</b> <code>${{ env.CORE_VER }}</code> (<code>android14-6.1</code>)
          🔹 <b>Working ROMs:</b> All AOSP, HyperOS, MIUI & Ports (Kernel 6.1)
          🔹 <b>Supported APK:</b> <a href=\"${{ env.APK_URL }}\">Spoofed Manager Build (Download)</a>

          🛠 <b>Flash:</b> <code>Reboot Recovery ➔ Flash ZIP ➔ Reboot & Install Spoofed APK</code>"

          RESP=$(curl -s --retry 3 \
            --form-string "chat_id=${TG_CHAT_ID}" \
            -F "document=@${{ env.ZIP_NAME }}" \
            --form-string "parse_mode=HTML" \
            --form-string "caption=${CAPTION}" \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument")

          if [ "$(echo "$RESP" | jq -r .ok)" != "true" ]; then
            curl -s --retry 3 \
              --form-string "chat_id=-1004367113991" \
              -F "document=@${{ env.ZIP_NAME }}" \
              --form-string "parse_mode=HTML" \
              --form-string "caption=${CAPTION}" \
              "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument"
          fi
